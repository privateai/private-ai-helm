{{- if not .Values.externalsecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.deployment.license.name }}
  {{- with .Values.deployment.license.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
data:
  license.json: |-
{{- .Values.deployment.license.data | b64enc | nindent 4 }}
{{- end }}
