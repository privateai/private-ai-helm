{{- if .Values.apiGateway.enabled }}
---
# Gateway resource for Kubernetes API Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.apiGateway.gatewayName }}
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
  {{- with .Values.apiGateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.apiGateway.gatewayClassName }}
  listeners:
  {{- if .Values.apiGateway.listeners.http.enabled }}
  - name: http
    protocol: HTTP
    port: {{ .Values.apiGateway.listeners.http.port }}
    {{- if .Values.apiGateway.listeners.http.hostname }}
    hostname: {{ .Values.apiGateway.listeners.http.hostname }}
    {{- end }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  {{- if .Values.apiGateway.listeners.https.enabled }}
  - name: https
    protocol: HTTPS
    port: {{ .Values.apiGateway.listeners.https.port }}
    {{- if .Values.apiGateway.listeners.https.hostname }}
    hostname: {{ .Values.apiGateway.listeners.https.hostname }}
    {{- end }}
    tls:
      mode: Terminate
      certificateRef:
        name: {{ .Values.apiGateway.listeners.https.certificateRef }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
---
# HTTPRoute resource for routing traffic to the Private AI service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "private-ai.fullname" . }}-route
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
  {{- with .Values.apiGateway.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  - name: {{ .Values.apiGateway.gatewayName }}
  hostnames:
  - {{ .Values.apiGateway.httpRoute.hostname }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.apiGateway.httpRoute.pathPrefix }}
    backendRefs:
    - name: {{ include "private-ai.fullname" . }}
      port: {{ .Values.apiGateway.httpRoute.port }}
      weight: 100
    timeouts:
      request: 30s
      backendRequest: 30s
{{- end }}
