{{- if .Values.externalsecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalsecrets.license.name }}
  annotations:
    {{- include "toYaml" .Values.externalsecrets.license.annotations | indent 4 }}
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalsecrets.secretstorename }}
    kind: SecretStore
  refreshInterval: {{ .Values.externalsecrets.license.refreshInterval }}
  target:
    name: {{ .Values.externalsecrets.license.name }}
  data:
    - secretKey: license.json
      remoteRef:
        key: {{ .Values.externalsecrets.license.remoteRefKey }}
        property: license.json
{{- end }}
